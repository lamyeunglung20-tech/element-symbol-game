<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2863e8">
  <meta name="description" content="透過選擇題記熟元素週期表首 20 個元素及常見金屬的化學符號。">
  <title>元素符號大挑戰</title>
  <style>
    :root { font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif; color: #243247; background: #f7f9fd; }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; }
    button { font: inherit; cursor: pointer; }
    button:focus-visible { outline: 4px solid #ffc83d; outline-offset: 3px; }
    [hidden] { display: none !important; }
    .hero { background: #2863e8; color: white; text-align: center; padding: 28px 20px 58px; }
    .hero-inner { max-width: 1100px; margin: auto; position: relative; }
    .language { display: flex; align-items: center; gap: 8px; position: absolute; right: 0; top: 0; border: 0; border-radius: 40px; padding: 11px 17px; color: #253145; background: white; font-weight: 800; box-shadow: 0 3px 0 rgba(17,42,105,.14); }
    .language svg { width: 20px; height: 20px; }
    .bolt { width: 66px; height: 76px; margin: 16px auto 20px; fill: #ffdf43; }
    .hero h1 { margin: 0; font-size: clamp(2.3rem, 6vw, 4.5rem); line-height: 1.18; letter-spacing: .05em; }
    .hero p { margin: 20px auto 0; font-size: clamp(1rem, 2.6vw, 1.5rem); opacity: .94; }
    main { width: min(1050px, calc(100% - 32px)); margin: 36px auto 70px; }
    .notice { background: #eaf0ff; color: #22428f; border-radius: 20px; padding: 21px 28px; text-align: center; font-size: clamp(1rem, 2vw, 1.18rem); font-weight: 750; line-height: 1.65; }
    .review-link { display: block; width: 100%; margin: 24px 0 34px; border: 0; border-radius: 18px; padding: 21px; color: white; background: #12b987; box-shadow: 0 6px 0 #079c70, 0 12px 18px rgba(3, 88, 68, .12); font-size: 1.27rem; font-weight: 850; }
    .review-link:hover, .start:hover { filter: brightness(.97); transform: translateY(-2px); }
    .section-title { display: flex; align-items: center; gap: 10px; margin: 27px 0 14px; font-size: 1.24rem; font-weight: 850; }
    .section-title svg { width: 23px; height: 23px; color: #4284fb; }
    .choice-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
    .choice-card { min-height: 130px; padding: 20px 15px; border: 3px solid #e2e7ef; border-radius: 18px; background: white; color: #4c586b; text-align: center; transition: transform .15s, border-color .15s, background .15s, box-shadow .15s; }
    .choice-card:hover { transform: translateY(-2px); border-color: #9abcfb; }
    .choice-card.selected { border-color: #347cf4; background: #eaf2ff; color: #1746a1; box-shadow: 0 5px 12px rgba(46,107,225,.14); }
    .choice-card .icon { display: block; font-size: 1.55rem; font-weight: 900; line-height: 1.2; margin-bottom: 11px; }
    .choice-card strong { display: block; font-size: 1.02rem; line-height: 1.35; }
    .choice-card small { display: block; margin-top: 6px; color: #6b7588; line-height: 1.3; }
    .segmented { display: flex; flex-wrap: wrap; gap: 10px; }
    .segment { flex: 1 1 160px; min-height: 50px; padding: 9px 12px; border: 2px solid #dfe5ee; border-radius: 13px; color: #536073; background: white; font-weight: 750; }
    .segment.selected { border-color: #3d80f4; background: #eaf2ff; color: #16479e; }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 34px; }
    .start { min-height: 116px; border: 0; border-radius: 18px; color: white; box-shadow: 0 6px 0 rgba(0,0,0,.1), 0 12px 18px rgba(0,0,0,.1); transition: transform .15s, filter .15s; }
    .start strong { display: block; font-size: clamp(1.18rem, 3vw, 1.65rem); }
    .start span { display: block; font-size: .88rem; margin-top: 4px; opacity: .95; }
    .start.training { background: #3c83f6; }
    .start.death { background: #f34245; }
    .panel { border: 1px solid #e4e9f1; border-radius: 22px; background: white; padding: clamp(20px, 4vw, 36px); box-shadow: 0 14px 35px rgba(31,61,109,.08); }
    .panel-head { display: flex; justify-content: space-between; align-items: center; gap: 18px; margin-bottom: 22px; }
    .panel-head h2 { margin: 0; font-size: clamp(1.3rem, 3vw, 1.8rem); }
    .back { border: 2px solid #dce4f0; background: white; color: #324a73; border-radius: 12px; padding: 9px 15px; font-weight: 750; }
    .back:hover { background: #eff5ff; }
    .review-intro { margin: -4px 0 22px; color: #617086; }
    .element-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; margin-top: 20px; }
    .element-card { min-height: 141px; border: 2px solid #dfe7f4; background: #f9fbff; border-radius: 16px; padding: 14px; text-align: left; color: #20324f; }
    .element-card:hover { border-color: #81afff; background: #eff6ff; }
    .element-card .number { color: #728199; font-size: .76rem; font-weight: 800; }
    .element-card .symbol { display: block; font-size: 2rem; font-weight: 900; color: #2364e7; line-height: 1.1; margin: 4px 0; }
    .element-card .element-name { display: block; font-size: 1rem; font-weight: 800; }
    .quiz-meta { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 7px; color: #5e6e87; font-size: .9rem; font-weight: 750; }
    .progress { height: 11px; background: #e6edfa; border-radius: 99px; margin: 13px 0 31px; overflow: hidden; }
    .progress > div { width: 0; height: 100%; background: #2f7df4; border-radius: inherit; transition: width .25s; }
    .prompt-label { color: #5d6c82; font-weight: 750; text-align: center; }
    .prompt { margin: 4px auto 27px; text-align: center; color: #1d56cf; font-size: clamp(2.8rem, 8vw, 5rem); line-height: 1.22; font-weight: 900; }
    .prompt.name { font-size: clamp(2.1rem, 6vw, 3.6rem); }
    .answer-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 13px; }
    .answer { display: flex; align-items: center; min-height: 91px; gap: 13px; border: 2px solid #dfe6f0; border-radius: 15px; background: white; padding: 13px 17px; text-align: left; color: #24334a; }
    .answer:hover:not(:disabled) { border-color: #4389f5; background: #f2f7ff; }
    .answer:disabled { cursor: default; }
    .answer.correct { border-color: #11b881; background: #e4faef; }
    .answer.wrong { border-color: #ef4d5c; background: #fff0f0; }
    .answer-key { flex: 0 0 31px; display: grid; place-items: center; width: 31px; height: 31px; border-radius: 9px; background: #eef3fb; color: #55709b; font-weight: 850; }
    .answer strong { display: block; font-size: 1.08rem; }
    .feedback { min-height: 52px; margin: 17px 0 0; border-radius: 12px; padding: 12px 15px; font-weight: 800; }
    .feedback.good { background: #e4faef; color: #087451; }
    .feedback.bad { background: #fff0ee; color: #aa3036; }
    .next { display: block; width: 100%; border: 0; border-radius: 13px; margin-top: 17px; padding: 15px; color: white; background: #317af1; font-weight: 850; }
    .result-icon { text-align: center; font-size: 3rem; }
    .result-title, .result-summary { text-align: center; }
    .result-title { font-size: 1.8rem; margin: 7px 0; }
    .result-summary { color: #5d6c83; font-size: 1.1rem; margin: 0 0 25px; }
    .missed-title { font-weight: 850; margin: 20px 0 10px; }
    .missed-list { display: grid; gap: 8px; }
    .missed-row { display: flex; justify-content: space-between; gap: 10px; border-radius: 11px; background: #f4f7fc; padding: 12px 14px; }
    .result-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 25px; }
    .result-actions button { flex: 1 1 180px; border: 0; border-radius: 12px; min-height: 49px; padding: 10px; color: white; background: #367df2; font-weight: 800; }
    .result-actions button.secondary { color: #31527e; background: #eaf1fc; }
    @media (max-width: 680px) {
      .hero { padding: 22px 15px 40px; }
      .language { position: static; width: max-content; margin: 0 0 0 auto; font-size: .84rem; }
      .bolt { margin-top: 0; }
      main { margin-top: 22px; }
      .choice-grid { grid-template-columns: 1fr; }
      .choice-card { min-height: 77px; display: flex; align-items: center; gap: 16px; text-align: left; }
      .choice-card .icon { margin: 0; min-width: 43px; text-align: center; }
      .choice-card small { margin-top: 2px; }
      .actions, .answer-grid { grid-template-columns: 1fr; }
      .actions { margin-top: 25px; }
      .start { min-height: 94px; }
      .panel-head { align-items: flex-start; }
    }
  </style>
</head>
<body>
  <header class="hero">
    <div class="hero-inner">
      <button id="language" class="language" type="button" aria-label="切換語言">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="2" y="3" width="20" height="18" rx="2"/><path d="M5 8h9M9.5 6v2c0 4-2 6-5 8m2-6c.5 2.5 2.5 4.5 5 6m2 1 3-8 3 8m-5-.8h4"/></svg>
        <span id="language-label">切換語言</span>
      </button>
      <svg class="bolt" viewBox="0 0 80 95" aria-hidden="true"><path d="M50 3a7 7 0 0 1 11 8L47 39h20a7 7 0 0 1 5 12L29 91a7 7 0 0 1-11-8l14-29H12a7 7 0 0 1-5-12Z"/></svg>
      <h1 data-i18n="title">元素符號大挑戰</h1>
      <p data-i18n="subtitle">記熟首 20 個元素及常見金屬的化學符號！</p>
    </div>
  </header>

  <main>
    <section id="home">
      <div class="notice" data-i18n="intro">題庫共有 28 個元素。先溫習，再選擇題目方向和範圍開始挑戰！</div>
      <button id="review-open" class="review-link" type="button" data-i18n="review">▣　溫習元素筆記</button>

      <div class="section-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="9" cy="6" r="2" fill="white"/><circle cx="16" cy="12" r="2" fill="white"/><circle cx="7" cy="18" r="2" fill="white"/></svg><span data-i18n="directionHeading">選擇題目方向</span></div>
      <div class="choice-grid" id="direction-options" role="group" aria-label="題目方向">
        <button class="choice-card selected" data-direction="symbolToName" type="button" aria-pressed="true"><span class="icon">H → 氫</span><span><strong data-i18n="symbolToName">符號 → 名稱</strong><small data-i18n="symbolToNameHint">看符號，選元素名稱</small></span></button>
        <button class="choice-card" data-direction="nameToSymbol" type="button" aria-pressed="false"><span class="icon">氫 → H</span><span><strong data-i18n="nameToSymbol">名稱 → 符號</strong><small data-i18n="nameToSymbolHint">看名稱，選化學符號</small></span></button>
        <button class="choice-card" data-direction="mixed" type="button" aria-pressed="false"><span class="icon">⇄</span><span><strong data-i18n="mixed">混合模式</strong><small data-i18n="mixedHint">兩種方向交替出題</small></span></button>
      </div>

      <div class="section-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg><span data-i18n="scopeHeading">選擇練習範圍</span></div>
      <div class="segmented" id="scope-options" role="group" aria-label="練習範圍">
        <button class="segment selected" data-scope="all" type="button" aria-pressed="true" data-i18n="allScope">全部 28 個</button>
        <button class="segment" data-scope="first20" type="button" aria-pressed="false" data-i18n="first20">首 20 個元素</button>
        <button class="segment" data-scope="extra" type="button" aria-pressed="false" data-i18n="extra">額外 8 個元素</button>
      </div>

      <div class="section-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M12 3v18M4 8h16M4 16h16"/></svg><span data-i18n="countHeading">訓練題數</span></div>
      <div class="segmented" id="count-options" role="group" aria-label="訓練題數">
        <button class="segment" data-count="10" type="button" aria-pressed="false" data-i18n="tenQuestions">10 題</button>
        <button class="segment" data-count="20" type="button" aria-pressed="false" data-i18n="twentyQuestions">20 題</button>
        <button class="segment selected" data-count="all" type="button" aria-pressed="true" data-i18n="allQuestions">全部題目</button>
      </div>

      <div class="actions">
        <button id="start-training" class="start training" type="button"><strong data-i18n="training">⚡ 訓練模式</strong><span data-i18n="trainingHint">答完題目，查看成績與錯題</span></button>
        <button id="start-death" class="start death" type="button"><strong data-i18n="death">☠ 死亡挑戰模式</strong><span data-i18n="deathHint">範圍內全部題目，答錯 5 次即結束</span></button>
      </div>
    </section>

    <section id="review-view" class="panel" hidden>
      <div class="panel-head"><h2 data-i18n="reviewTitle">元素筆記</h2><button class="back" data-back type="button" data-i18n="back">← 返回首頁</button></div>
      <p class="review-intro" data-i18n="reviewIntro">點按元素卡片，可遮蓋或顯示化學符號，自己測試記憶。</p>
      <div class="segmented" id="review-filters" role="group" aria-label="筆記範圍">
        <button class="segment selected" data-review-scope="all" type="button" aria-pressed="true" data-i18n="allScope">全部 28 個</button>
        <button class="segment" data-review-scope="first20" type="button" aria-pressed="false" data-i18n="first20">首 20 個元素</button>
        <button class="segment" data-review-scope="extra" type="button" aria-pressed="false" data-i18n="extra">額外 8 個元素</button>
      </div>
      <div id="element-grid" class="element-grid"></div>
    </section>

    <section id="quiz-view" class="panel" hidden>
      <div class="panel-head"><h2 id="quiz-title">訓練模式</h2><button class="back" data-back type="button" data-i18n="quit">← 結束挑戰</button></div>
      <div class="quiz-meta"><span id="step-label"></span><span id="score-label"></span></div>
      <div class="progress" aria-hidden="true"><div id="progress-fill"></div></div>
      <div id="prompt-label" class="prompt-label"></div>
      <div id="prompt" class="prompt"></div>
      <div id="answer-grid" class="answer-grid" role="group" aria-label="答案選項"></div>
      <div id="feedback" class="feedback" role="status" aria-live="polite" hidden></div>
      <button id="next" class="next" type="button" hidden></button>
    </section>

    <section id="result-view" class="panel" hidden>
      <div id="result-icon" class="result-icon" aria-hidden="true"></div>
      <h2 id="result-title" class="result-title"></h2>
      <p id="result-summary" class="result-summary"></p>
      <div id="missed-wrap" hidden><div class="missed-title" data-i18n="missedHeading">需要再溫習的元素</div><div id="missed-list" class="missed-list"></div></div>
      <div class="result-actions"><button id="retry" type="button" data-i18n="retry">再玩一次</button><button class="secondary" data-back type="button" data-i18n="back">← 返回首頁</button></div>
    </section>
  </main>

  <script>
  (() => {
    "use strict";
    const ELEMENTS = [
      [1,"H","氫","Hydrogen"],[2,"He","氦","Helium"],[3,"Li","鋰","Lithium"],[4,"Be","鈹","Beryllium"],
      [5,"B","硼","Boron"],[6,"C","碳","Carbon"],[7,"N","氮","Nitrogen"],[8,"O","氧","Oxygen"],
      [9,"F","氟","Fluorine"],[10,"Ne","氖","Neon"],[11,"Na","鈉","Sodium"],[12,"Mg","鎂","Magnesium"],
      [13,"Al","鋁","Aluminium"],[14,"Si","硅","Silicon"],[15,"P","磷","Phosphorus"],[16,"S","硫","Sulphur"],
      [17,"Cl","氯","Chlorine"],[18,"Ar","氬","Argon"],[19,"K","鉀","Potassium"],[20,"Ca","鈣","Calcium"],
      [26,"Fe","鐵","Iron"],[29,"Cu","銅","Copper"],[30,"Zn","鋅","Zinc"],[47,"Ag","銀","Silver"],
      [50,"Sn","錫","Tin"],[79,"Au","金","Gold"],[80,"Hg","汞","Mercury"],[82,"Pb","鉛","Lead"]
    ].map(([number,symbol,zh,en]) => ({number,symbol,zh,en}));
    const T = {
      zh: {
        title:"元素符號大挑戰",subtitle:"記熟首 20 個元素及常見金屬的化學符號！",intro:"題庫共有 28 個元素。先溫習，再選擇題目方向和範圍開始挑戰！",review:"▣　溫習元素筆記",directionHeading:"選擇題目方向",symbolToName:"符號 → 名稱",symbolToNameHint:"看符號，選元素名稱",nameToSymbol:"名稱 → 符號",nameToSymbolHint:"看名稱，選化學符號",exampleSymbolToName:"H → 氫",exampleNameToSymbol:"氫 → H",mixed:"混合模式",mixedHint:"兩種方向交替出題",scopeHeading:"選擇練習範圍",allScope:"全部 28 個",first20:"首 20 個元素",extra:"額外 8 個元素",countHeading:"訓練題數",tenQuestions:"10 題",twentyQuestions:"20 題",allQuestions:"全部題目",training:"⚡ 訓練模式",trainingHint:"答完題目，查看成績與錯題",death:"☠ 死亡挑戰模式",deathHint:"範圍內全部題目，答錯 5 次即結束",reviewTitle:"元素筆記",back:"← 返回首頁",reviewIntro:"點按元素卡片，可遮蓋或顯示化學符號，自己測試記憶。",quit:"← 結束挑戰",missedHeading:"需要再溫習的元素",retry:"再玩一次",question:"第 {current} / {total} 題",score:"答對 {correct} 題 · 答錯 {wrong} 題",lives:"答對 {correct} 題 · 餘下 {left} 次失誤機會",askName:"這個化學符號代表甚麼元素？",askSymbol:"這個元素的化學符號是甚麼？",answerChoices:"答案選項",right:"答對了！{name} 的符號是 {symbol}。",wrong:"答錯了。{name} 的符號是 {symbol}。",next:"下一題 →",seeResult:"查看成績 →",success:"挑戰完成！",failed:"挑戰結束",result:"答對 {correct} / {answered} 題（{percent}%）。",deathResult:"答對 {correct} / {answered} 題，失誤 {wrong} 次。",hiddenSymbol:"點按顯示符號",number:"原子序數 {number}"
      },
      en: {
        title:"Element Symbol Challenge",subtitle:"Learn the first 20 elements and eight common metals!",intro:"The bank contains 28 elements. Review them, then choose a direction and a set to begin.",review:"▣　Review the elements",directionHeading:"Choose a question direction",symbolToName:"Symbol → Name",symbolToNameHint:"See a symbol, choose its name",nameToSymbol:"Name → Symbol",nameToSymbolHint:"See a name, choose its symbol",exampleSymbolToName:"H → Hydrogen",exampleNameToSymbol:"Hydrogen → H",mixed:"Mixed mode",mixedHint:"Alternate both directions",scopeHeading:"Choose an element set",allScope:"All 28 elements",first20:"First 20 elements",extra:"Extra 8 elements",countHeading:"Training questions",tenQuestions:"10 questions",twentyQuestions:"20 questions",allQuestions:"All questions",training:"⚡ Training mode",trainingHint:"Finish the round and review mistakes",death:"☠ Survival challenge",deathHint:"All selected elements; five mistakes end the round",reviewTitle:"Element notes",back:"← Back to home",reviewIntro:"Tap a card to hide or reveal its symbol and test your memory.",quit:"← End challenge",missedHeading:"Elements to review",retry:"Play again",question:"Question {current} / {total}",score:"{correct} correct · {wrong} incorrect",lives:"{correct} correct · {left} misses left",askName:"Which element has this symbol?",askSymbol:"What is the symbol of this element?",answerChoices:"Answer choices",right:"Correct! {name} has the symbol {symbol}.",wrong:"Not quite. {name} has the symbol {symbol}.",next:"Next question →",seeResult:"See results →",success:"Challenge complete!",failed:"Challenge over",result:"{correct} / {answered} correct ({percent}%).",deathResult:"{correct} / {answered} correct; {wrong} mistakes.",hiddenSymbol:"Tap to show symbol",number:"Atomic number {number}"
      }
    };
    const $ = id => document.getElementById(id);
    const state = {lang:"zh",direction:"symbolToName",scope:"all",count:"all",reviewScope:"all",session:null};
    const translate = (key, values={}) => T[state.lang][key].replace(/\{(\w+)\}/g, (_,name) => String(values[name] ?? ""));
    const elementsFor = scope => scope === "first20" ? ELEMENTS.slice(0,20) : scope === "extra" ? ELEMENTS.slice(20) : ELEMENTS;
    const shuffle = source => {
      const a = [...source];
      for (let i=a.length-1; i>0; i--) { const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
      return a;
    };
    const setView = view => {
      for (const id of ["home","review-view","quiz-view","result-view"]) $(id).hidden = id !== view;
      window.scrollTo({top:0,behavior:"smooth"});
    };
    function updateI18n() {
      document.documentElement.lang = state.lang === "zh" ? "zh-Hant" : "en";
      document.title = translate("title");
      document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = translate(el.dataset.i18n); });
      $("language-label").textContent = state.lang === "zh" ? "切換語言" : "Switch language";
      $("language").setAttribute("aria-label",$("language-label").textContent);
      document.querySelector('[data-direction="symbolToName"] .icon').textContent = translate("exampleSymbolToName");
      document.querySelector('[data-direction="nameToSymbol"] .icon').textContent = translate("exampleNameToSymbol");
      $("direction-options").setAttribute("aria-label",translate("directionHeading"));
      $("scope-options").setAttribute("aria-label",translate("scopeHeading"));
      $("count-options").setAttribute("aria-label",translate("countHeading"));
      $("review-filters").setAttribute("aria-label",translate("scopeHeading"));
      $("answer-grid").setAttribute("aria-label",translate("answerChoices"));
      if (!$("review-view").hidden) renderReview();
      if (state.session) {
        if (!$("quiz-view").hidden) renderQuestion();
        if (!$("result-view").hidden) renderResult();
      }
    }
    function choose(group, attribute, value) {
      document.querySelectorAll(`#${group} [${attribute}]`).forEach(button => {
        const selected = button.getAttribute(attribute) === value;
        button.classList.toggle("selected",selected);
        button.setAttribute("aria-pressed",String(selected));
      });
    }
    function renderReview() {
      const grid = $("element-grid");
      grid.replaceChildren();
      elementsFor(state.reviewScope).forEach(element => {
        const card = document.createElement("button");
        card.type = "button";
        card.className = "element-card";
        card.setAttribute("aria-pressed","false");
        const number = document.createElement("span"); number.className="number"; number.textContent=translate("number",{number:element.number});
        const symbol = document.createElement("span"); symbol.className="symbol"; symbol.textContent=element.symbol;
        const name = document.createElement("span"); name.className="element-name"; name.textContent=state.lang === "zh" ? element.zh : element.en;
        card.append(number,symbol,name);
        card.addEventListener("click",() => { const hidden=card.getAttribute("aria-pressed") !== "true"; card.setAttribute("aria-pressed",String(hidden)); symbol.textContent=hidden ? "?" : element.symbol; symbol.setAttribute("aria-label",hidden ? translate("hiddenSymbol") : element.symbol); });
        grid.append(card);
      });
    }
    function start(kind) {
      const pool = elementsFor(state.scope);
      const count = kind === "death" || state.count === "all" ? pool.length : Math.min(Number(state.count),pool.length);
      const questions = shuffle(pool).slice(0,count);
      const firstDirection = Math.random() < .5 ? "symbolToName" : "nameToSymbol";
      state.session = {kind, questions, pool, index:0, correct:0, wrong:0, misses:[], answered:false, selected:null, firstDirection, config:{direction:state.direction,scope:state.scope,count:state.count}};
      setView("quiz-view"); renderQuestion();
    }
    function directionAt(index) {
      if (state.session.config.direction !== "mixed") return state.session.config.direction;
      return index % 2 === 0 ? state.session.firstDirection : (state.session.firstDirection === "symbolToName" ? "nameToSymbol" : "symbolToName");
    }
    function renderQuestion() {
      const s=state.session, element=s.questions[s.index], direction=directionAt(s.index);
      $("quiz-title").textContent=translate(s.kind === "death" ? "death" : "training");
      $("step-label").textContent=translate("question",{current:s.index+1,total:s.questions.length});
      $("score-label").textContent=s.kind === "death" ? translate("lives",{correct:s.correct,left:5-s.wrong}) : translate("score",{correct:s.correct,wrong:s.wrong});
      $("progress-fill").style.width=`${(s.index+(s.answered ? 1 : 0))/s.questions.length*100}%`;
      $("prompt-label").textContent=translate(direction === "symbolToName" ? "askName" : "askSymbol");
      $("prompt").classList.toggle("name",direction === "nameToSymbol");
      $("prompt").replaceChildren();
      if (direction === "symbolToName") $("prompt").textContent=element.symbol;
      else $("prompt").textContent=state.lang === "zh" ? element.zh : element.en;
      if (!s.options) s.options=shuffle([element,...shuffle(s.pool.filter(item => item !== element)).slice(0,3)]);
      const grid=$("answer-grid"); grid.replaceChildren();
      s.options.forEach((option,i) => {
        const button=document.createElement("button"); button.type="button"; button.className="answer";
        if (s.answered && option === element) button.classList.add("correct");
        if (s.answered && s.selected === option && option !== element) button.classList.add("wrong");
        button.disabled=s.answered;
        const key=document.createElement("span"); key.className="answer-key"; key.textContent="ABCD"[i];
        const label=document.createElement("span");
        const strong=document.createElement("strong"); strong.textContent=direction === "nameToSymbol" ? option.symbol : (state.lang === "zh" ? option.zh : option.en);
        label.append(strong);
        button.append(key,label);
        button.addEventListener("click",() => answer(option));
        grid.append(button);
      });
      $("feedback").hidden=!s.answered;
      if (s.answered) {
        $("feedback").className=`feedback ${s.selected === element ? "good" : "bad"}`;
        $("feedback").textContent=translate(s.selected === element ? "right" : "wrong",{name:state.lang === "zh" ? element.zh : element.en,symbol:element.symbol});
      }
      $("next").hidden=!s.answered;
      $("next").textContent=translate(s.index === s.questions.length-1 || (s.kind === "death" && s.wrong >= 5) ? "seeResult" : "next");
    }
    function answer(option) {
      const s=state.session;
      if (!s || s.answered) return;
      s.answered=true; s.selected=option;
      if (option === s.questions[s.index]) s.correct++;
      else { s.wrong++; s.misses.push(s.questions[s.index]); }
      renderQuestion();
    }
    function advance() {
      const s=state.session;
      if (!s || !s.answered) return;
      if (s.index+1 >= s.questions.length || (s.kind === "death" && s.wrong >= 5)) { setView("result-view"); renderResult(); return; }
      s.index++; s.answered=false; s.selected=null; s.options=null; renderQuestion();
    }
    function renderResult() {
      const s=state.session, answered=s.correct+s.wrong, failed=s.kind === "death" && s.wrong >= 5;
      $("result-icon").textContent=failed ? "☠️" : s.wrong === 0 ? "🏆" : "🎉";
      $("result-title").textContent=translate(failed ? "failed" : "success");
      $("result-summary").textContent=translate(s.kind === "death" ? "deathResult" : "result",{correct:s.correct,wrong:s.wrong,answered,percent:Math.round(s.correct/answered*100)});
      $("missed-wrap").hidden=s.misses.length === 0;
      $("missed-list").replaceChildren();
      s.misses.forEach(element => {
        const row=document.createElement("div"); row.className="missed-row";
        const name=document.createElement("span"); name.textContent=state.lang === "zh" ? element.zh : element.en;
        const symbol=document.createElement("strong"); symbol.textContent=element.symbol;
        row.append(name,symbol); $("missed-list").append(row);
      });
    }
    document.querySelectorAll("#direction-options [data-direction]").forEach(button => button.addEventListener("click",() => { state.direction=button.dataset.direction; choose("direction-options","data-direction",state.direction); }));
    document.querySelectorAll("#scope-options [data-scope]").forEach(button => button.addEventListener("click",() => { state.scope=button.dataset.scope; choose("scope-options","data-scope",state.scope); }));
    document.querySelectorAll("#count-options [data-count]").forEach(button => button.addEventListener("click",() => { state.count=button.dataset.count; choose("count-options","data-count",state.count); }));
    document.querySelectorAll("#review-filters [data-review-scope]").forEach(button => button.addEventListener("click",() => { state.reviewScope=button.dataset.reviewScope; choose("review-filters","data-review-scope",state.reviewScope); renderReview(); }));
    $("language").addEventListener("click",() => { state.lang=state.lang === "zh" ? "en" : "zh"; updateI18n(); });
    $("review-open").addEventListener("click",() => { state.reviewScope=state.scope; choose("review-filters","data-review-scope",state.reviewScope); renderReview(); setView("review-view"); });
    document.querySelectorAll("[data-back]").forEach(button => button.addEventListener("click",() => { state.session=null; setView("home"); }));
    $("start-training").addEventListener("click",() => start("training"));
    $("start-death").addEventListener("click",() => start("death"));
    $("next").addEventListener("click",advance);
    $("retry").addEventListener("click",() => { const config=state.session.config, kind=state.session.kind; Object.assign(state,config); choose("direction-options","data-direction",state.direction); choose("scope-options","data-scope",state.scope); choose("count-options","data-count",state.count); start(kind); });
    document.addEventListener("keydown",event => {
      if ($("quiz-view").hidden || event.altKey || event.ctrlKey || event.metaKey || /INPUT|TEXTAREA/.test(document.activeElement.tagName)) return;
      if (state.session.answered && event.key === "Enter") { event.preventDefault(); advance(); }
      else if (!state.session.answered && /^[1-4a-dA-D]$/.test(event.key)) {
        const i=/[1-4]/.test(event.key) ? Number(event.key)-1 : event.key.toUpperCase().charCodeAt(0)-65;
        event.preventDefault(); answer(state.session.options[i]);
      }
    });
    updateI18n();
  })();
  </script>
</body>
</html>
